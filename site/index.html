<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AnyMetrics</title>
  <meta name="description" content="Any HTTP endpoint → a live widget on your iPhone.">
  <meta property="og:title" content="AnyMetrics">
  <meta property="og:description" content="Any HTTP endpoint → a live widget on your iPhone.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="preview.jpg">
  <meta name="theme-color" content="#0b0b0b">
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <script>
    (function () {
      var theme = null;
      try { theme = localStorage.getItem("theme"); } catch (error) {}
      document.documentElement.dataset.theme = theme || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
    })();
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="home">
  <div class="glow" aria-hidden="true"></div>
  <button class="theme-toggle" type="button" role="switch" aria-checked="true" aria-label="Dark theme">
    <span class="theme-sun" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg></span>
    <span class="theme-moon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></span>
  </button>
  <main class="stage">
    <div class="lockup">
      <div class="robot" aria-hidden="true">
        <div class="robot-fill"></div>
        <div class="robot-plate">
          <div class="mark mark-left"></div>
          <div class="mark mark-right"></div>
        </div>
        <div class="robot-ring"></div>
      </div>
      <h1>AnyMetrics</h1>
      <p class="tagline">Turn any API into an iPhone widget.</p>
      <a class="store" href="https://apps.apple.com/us/app/anymetrics/id1609900961">
        <img src="appstore.svg" width="120" height="40" alt="Download on the App Store">
      </a>
    </div>
  </main>
  <footer>
    <a href="terms.html">Terms</a>
    <a href="privacy.html">Privacy</a>
    <a href="https://github.com/hudishkin/AnyMetrics">GitHub</a>
  </footer>
  <script src="robot.js"></script>
  <script src="parallax.js"></script>
  <script src="theme.js"></script>
</body>
</html>
