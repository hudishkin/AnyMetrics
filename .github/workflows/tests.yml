name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Generate project
        run: |
          tuist install
          tuist generate --no-open

      - name: Run unit tests
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          xcodebuild test \
            -workspace AnyMetrics.xcworkspace \
            -scheme AnyMetrics \
            -destination "id=$UDID" \
            -only-testing:AnyMetricsTests \
            CODE_SIGNING_ALLOWED=NO
