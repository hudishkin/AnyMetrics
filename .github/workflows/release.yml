name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

env:
  BUNDLE_ID: app.anymetrics.AnyMetrics
  TEAM_ID: ${{ secrets.TEAM_ID || 'Q424U5CAPS' }}

jobs:
  app-store:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Import distribution certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          p12-password: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}

      - name: Download app profile
        id: app-profile
        uses: apple-actions/download-provisioning-profiles@v7
        with:
          bundle-id: ${{ env.BUNDLE_ID }}
          profile-type: IOS_APP_STORE
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Download widget profile
        id: widget-profile
        uses: apple-actions/download-provisioning-profiles@v7
        with:
          bundle-id: ${{ env.BUNDLE_ID }}.WidgetExtension
          profile-type: IOS_APP_STORE
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Download intent profile
        id: intent-profile
        uses: apple-actions/download-provisioning-profiles@v7
        with:
          bundle-id: ${{ env.BUNDLE_ID }}.IntentExtension
          profile-type: IOS_APP_STORE
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Use downloaded profile names
        run: |
          pick_profile() {
            local bundle_id="$1"
            local preferred="$2"
            local dir="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
            local chosen="" fallback="" file plist name app_id managed
            echo "Profiles for $bundle_id:" >&2
            for file in "$dir"/*.mobileprovision; do
              plist=$(security cms -D -i "$file" 2>/dev/null) || continue
              name=$(printf '%s' "$plist" | plutil -extract Name raw -)
              app_id=$(printf '%s' "$plist" | plutil -extract Entitlements.application-identifier raw -)
              managed=$(printf '%s' "$plist" | plutil -extract IsXcodeManaged raw - 2>/dev/null || true)
              case "$app_id" in
                *."$bundle_id") ;;
                *) continue ;;
              esac
              echo "  - $name (managed=${managed:-false})" >&2
              if [ "$managed" = "true" ]; then
                rm -f "$file"
                continue
              fi
              if [ "$name" = "$preferred" ]; then
                chosen=$name
              elif [ -z "$fallback" ]; then
                fallback=$name
              fi
            done
            if [ -n "$chosen" ]; then
              printf '%s' "$chosen"
              return 0
            fi
            if [ -n "$fallback" ]; then
              echo "Using \"$fallback\" for $bundle_id." >&2
              printf '%s' "$fallback"
              return 0
            fi
            echo "::error::No manually managed App Store profile for $bundle_id. Create one in Apple Developer, include the Apple Distribution certificate from the .p12, and keep the Xcode profile \"iOS Team Store Provisioning Profile\" unused." >&2
            return 1
          }
          app_name=$(pick_profile "$BUNDLE_ID" "AnyMetrics App Store") || exit 1
          widget_name=$(pick_profile "$BUNDLE_ID.WidgetExtension" "AnyMetrics Widget App Store") || exit 1
          intent_name=$(pick_profile "$BUNDLE_ID.IntentExtension" "AnyMetrics Intent App Store") || exit 1
          {
            echo "APP_PROFILE<<EOF"
            echo "$app_name"
            echo "EOF"
            echo "WIDGET_PROFILE<<EOF"
            echo "$widget_name"
            echo "EOF"
            echo "INTENT_PROFILE<<EOF"
            echo "$intent_name"
            echo "EOF"
          } >> "$GITHUB_ENV"
          echo "App profile: $app_name"
          echo "Widget profile: $widget_name"
          echo "Intent profile: $intent_name"

      - name: Generate project
        env:
          BUILDER_API_URL: ${{ secrets.BUILDER_API_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GITHUB_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
        run: |
          if [ -z "$BUILDER_API_URL" ]; then
            echo "::error::Set the BUILDER_API_URL secret to the production API"
            exit 1
          fi
          export TUIST_TEAM_ID="$TEAM_ID"
          export TUIST_APP_PROFILE="$APP_PROFILE"
          export TUIST_WIDGET_PROFILE="$WIDGET_PROFILE"
          export TUIST_INTENT_PROFILE="$INTENT_PROFILE"
          export TUIST_BUILDER_API_URL="$BUILDER_API_URL"
          [ -n "$GOOGLE_CLIENT_ID" ] && export TUIST_GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID"
          [ -n "$GITHUB_CLIENT_ID" ] && export TUIST_GITHUB_CLIENT_ID="$GITHUB_CLIENT_ID"
          [ "$GITHUB_REF_TYPE" = "tag" ] && export TUIST_MARKETING_VERSION="${GITHUB_REF_NAME#v}"
          export TUIST_BUILD_NUMBER="$(date -u +%Y%m%d%H%M)"
          export TUIST_APP_STORE_SIGNING=1
          tuist install
          tuist generate --no-open

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace AnyMetrics.xcworkspace \
            -scheme AnyMetrics \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath "$RUNNER_TEMP/AnyMetrics.xcarchive"

      - name: Upload to App Store Connect
        env:
          API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -o pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_$API_KEY_ID.p8"
          printf '%s' "$API_PRIVATE_KEY" > "$KEY_PATH"

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key><string>$APP_PROFILE</string>
              <key>$BUNDLE_ID.WidgetExtension</key><string>$WIDGET_PROFILE</string>
              <key>$BUNDLE_ID.IntentExtension</key><string>$INTENT_PROFILE</string>
            </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/AnyMetrics.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER_ID"